spring.application.name=Inter-Unab
server.port=8080

# Base de datos SQLite: un archivo local (se crea solo la primera vez)
spring.datasource.url=jdbc:sqlite:${INTER_UNAB_DB_PATH:./inter-unab.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite permite una sola escritura a la vez: una conexion evita errores "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# Ejecuta schema.sql al arrancar (crea la tabla si no existe)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Para clase: los cambios en las plantillas HTML se ven al recargar la pagina
spring.thymeleaf.cache=false

# Configuración de subida de archivos (fotos de items)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Directorio donde se guardan las fotos subidas (relativo al directorio de trabajo)
app.upload.dir=${user.dir}/uploads
