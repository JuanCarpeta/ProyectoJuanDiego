spring.application.name=beauty-care-crud
server.port=8080

# Base de datos SQLite: un archivo local (se crea solo la primera vez)
spring.datasource.url=jdbc:sqlite:${BEAUTY_DB_PATH:./beautycare-crud.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite permite una sola escritura a la vez: una conexion evita errores "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# Ejecuta schema.sql al arrancar (crea la tabla si no existe)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Para clase: los cambios en las plantillas HTML se ven al recargar la pagina
spring.thymeleaf.cache=false
