<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Proponer intercambio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5" style="max-width: 760px;">

    <h1 class="h3 mb-3">Proponer intercambio</h1>

    <div class="card card-bc mb-4">
        <div class="card-body d-flex align-items-center gap-3">
            <img th:if="${itemObjetivo.fotos != null and not #lists.isEmpty(itemObjetivo.fotos)}"
                 th:src="@{|/uploads/${itemObjetivo.fotos[0].rutaArchivo}|}"
                 class="foto-mini" alt="Foto del item">
            <div>
                <div class="small text-muted">Quieres</div>
                <div class="fw-semibold" th:text="${itemObjetivo.nombre}">Item</div>
                <div class="small text-muted" th:text="${itemObjetivo.descripcion}">Descripción</div>
                <div class="small text-muted"
                     th:text="${itemObjetivo.publicadoPor != null ? 'Publicado por ' + itemObjetivo.publicadoPor : 'Sin dueño registrado'}">
                    Publicado por
                </div>
            </div>
        </div>
    </div>

    <div class="card card-bc">
        <div class="card-body p-4">

            <form th:action="@{/intercambios/guardar}" method="post">

                <input type="hidden" name="itemSolicitadoId" th:value="${itemObjetivo.id}">

                <div class="mb-3">
                    <label for="itemOfrecidoId" class="form-label">¿Qué item ofreces a cambio?</label>
                    <select id="itemOfrecidoId" name="itemOfrecidoId" class="form-select" required>
                        <option value="">Selecciona uno de tus items...</option>
                        <option th:each="i : ${itemsOfrecibles}"
                                th:value="${i.id}"
                                th:text="${i.nombre} + ' · ' + ${i.categoria} + ' · ' + ${i.estado}">
                            Item
                        </option>
                    </select>
                    <div class="form-text">
                        Solo aparecen items que siguen disponibles. Si no ves el tuyo, publícalo primero.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="mensaje" class="form-label">
                        Mensaje <span class="text-muted">(opcional)</span>
                    </label>
                    <textarea id="mensaje" name="mensaje" class="form-control" rows="3" maxlength="500"
                              placeholder="Ej: Te propongo mi libro de Cálculo, está impecable. ¿Te sirve?"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-bc">Enviar propuesta</button>
                    <a class="btn btn-bc-outline" th:href="@{/items}">Cancelar</a>
                </div>
            </form>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
