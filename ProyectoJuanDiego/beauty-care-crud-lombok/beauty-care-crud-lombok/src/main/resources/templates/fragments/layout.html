<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Partes comunes que reutilizan todas las paginas (head y barra superior) -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Inter-Unab'">Inter-Unab</title>
    <!-- Bootstrap 5 desde CDN (se necesita internet en el navegador) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<nav th:fragment="navbar" class="navbar navbar-expand navbar-bc navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Inter-Unab</a>
        <div class="navbar-nav flex-row gap-3 ms-3">
            <a class="nav-link text-white" th:href="@{/items}">Items</a>
            <a class="nav-link text-white" th:href="@{/intercambios}">Intercambios</a>
        </div>

        <div class="ms-auto d-flex align-items-center gap-2">
            <span class="navbar-text text-white-50 small d-none d-lg-inline" th:if="${usuarioActual == null}">
                Plataforma de intercambio para estudiantes UNAB
            </span>
            <span class="navbar-text text-white small mb-0" th:if="${usuarioActual != null}">
                <span class="text-white-50">Estás como</span>
                <strong th:text="${usuarioActual.getNombreVisible()}">correo</strong>
            </span>
            <a class="btn btn-sm btn-light" th:if="${usuarioActual == null}"
               th:href="@{/login}">Iniciar sesión</a>
            <a class="btn btn-sm btn-outline-light" th:if="${usuarioActual != null}"
               th:href="@{/logout}">Salir</a>
        </div>
    </div>
</nav>
