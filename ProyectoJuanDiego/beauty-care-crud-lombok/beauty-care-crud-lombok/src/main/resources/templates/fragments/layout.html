<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Partes comunes que reutilizan todas las paginas (head y barra superior) -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Beauty Care'">Beauty Care</title>
    <!-- Bootstrap 5 desde CDN (se necesita internet en el navegador) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<body>
<nav th:fragment="navbar" class="navbar navbar-bc navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/productos}">Beauty Care</a>
        <span class="navbar-text text-white-50 small">Catálogo de productos</span>
    </div>
</nav>
</body>
</html>
