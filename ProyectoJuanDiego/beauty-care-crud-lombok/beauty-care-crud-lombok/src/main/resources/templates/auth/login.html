<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5" style="max-width: 520px;">

    <h1 class="h3 mb-3">Iniciar sesión</h1>

    <div th:if="${mensaje}" class="alert alert-success" role="alert">
        <span th:text="${mensaje}">Listo</span>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}">Error</span>
    </div>

    <div th:if="${sugerirRegistro}" class="alert alert-info d-flex flex-wrap justify-content-between align-items-center gap-2"
         role="alert">
        <span>¿Primera vez en Inter-Unab? Crea tu cuenta institucional.</span>
        <a class="btn btn-sm btn-bc" th:href="@{/registro(email=${emailPrevio})}">Crear cuenta</a>
    </div>

    <div class="card card-bc">
        <div class="card-body p-4">

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo institucional</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="nombre.apellido@unab.edu.co" required
                           th:value="${emailPrevio}">
                    <div class="form-text">Solo cuentas @unab.edu.co.</div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <div class="d-flex gap-2 align-items-center">
                    <button type="submit" class="btn btn-bc">Entrar</button>
                    <a class="btn btn-bc-outline" th:href="@{/registro(email=${emailPrevio})}">Crear cuenta</a>
                </div>
            </form>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
