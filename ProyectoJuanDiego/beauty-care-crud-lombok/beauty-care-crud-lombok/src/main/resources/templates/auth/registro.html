<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5" style="max-width: 520px;">

    <h1 class="h3 mb-3">Crear cuenta</h1>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}">Error</span>
    </div>

    <div class="card card-bc">
        <div class="card-body p-4">

            <p class="small text-muted">
                Solo se aceptan correos institucionales terminados en <strong>@unab.edu.co</strong>.
            </p>

            <form th:action="@{/registro}" method="post">

                <div class="mb-3">
                    <label for="email" class="form-label">Correo institucional</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="nombre.apellido@unab.edu.co" required
                           th:value="${emailPrevio}">
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre <span class="text-muted">(opcional)</span>
                    </label>
                    <input type="text" id="nombre" name="nombre" class="form-control" maxlength="60"
                           placeholder="Cómo quieres que te vean" th:value="${nombrePrevio}">
                </div>

                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control"
                               minlength="6" required>
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label for="password2" class="form-label">Repetir contraseña</label>
                        <input type="password" id="password2" name="password2" class="form-control"
                               minlength="6" required>
                    </div>
                </div>
                <div class="form-text mb-4">Mínimo 6 caracteres.</div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-bc">Crear cuenta</button>
                    <a class="btn btn-bc-outline" th:href="@{/login}">Ya tengo cuenta</a>
                </div>
            </form>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
