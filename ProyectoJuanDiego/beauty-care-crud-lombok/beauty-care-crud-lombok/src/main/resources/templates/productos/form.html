<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5" style="max-width: 720px;">

    <h1 class="h3 mb-3" th:text="${titulo}">Nuevo zapato</h1>

    <div class="card card-bc">
        <div class="card-body p-4">

            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" novalidate>
                <!-- Si tiene id, se esta editando; si no, se esta creando -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del zapato</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                           th:errorclass="is-invalid" maxlength="80">
                    <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
                </div>

                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoría del zapato</label>
                    <select id="categoria" class="form-select" th:field="*{categoria}" th:errorclass="is-invalid">
                        <option value="">Selecciona...</option>
                        <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}">Categoría</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{categoria}">Error</div>
                </div>

                <div class="row">
                    <div class="col-sm-6 mb-3">
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label for="stock" class="form-label">Stock</label>
                        <input type="number" id="stock" class="form-control" th:field="*{stock}"
                               th:errorclass="is-invalid" min="0">
                        <div class="invalid-feedback" th:errors="*{stock}">Error</div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="descripcion" class="form-label">Descripción <span class="text-muted">(opcional)</span></label>
                    <textarea id="descripcion" class="form-control" rows="3" th:field="*{descripcion}"
                              th:errorclass="is-invalid" maxlength="255"></textarea>
                    <div class="invalid-feedback" th:errors="*{descripcion}">Error</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-bc">Guardar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a>
                </div>
            </form>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
